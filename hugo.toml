# 部署前请修改为实际域名：
#   GitHub Pages: https://<username>.github.io/<repo>/
#   自定义域名:   https://yourdomain.com/
baseURL = '/'
locale = 'zh-cn'
title = 'AI 工具导航'
theme = 'PaperMod'

[params]
  description = "发现最好用的 AI 工具，提高工作效率"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowToc = true

[[params.socialIcons]]
  name = "github"
  url = "https://github.com"

[menu]
  [[menu.main]]
    name = "写作工具"
    url = "/tags/写作/"
    weight = 1
  [[menu.main]]
    name = "绘画工具"
    url = "/tags/绘画/"
    weight = 2
  [[menu.main]]
    name = "编程工具"
    url = "/tags/编程/"
    weight = 3
  [[menu.main]]
    name = "效率工具"
    url = "/tags/效率/"
    weight = 4
  [[menu.main]]
    name = "全部工具"
    url = "/archives/"
    weight = 5

[outputs]
  home = ["HTML", "RSS", "JSON"]
